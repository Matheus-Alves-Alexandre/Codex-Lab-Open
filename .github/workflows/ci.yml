name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Audit dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm run audit:security 2>&1 | tee ci-logs/dependency-audit.log
      - name: Check types, unit tests, coverage and production build
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ci-logs/application-checks.log
      - name: Test Firestore access rules
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee ci-logs/firestore-rules.log
      - run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee ci-logs/browser-tests.log
      - name: Test catalog load and failure scenarios
        run: |
          set -o pipefail
          npm run test:load 2>&1 | tee ci-logs/load-tests.log
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          for log in firebase-debug.log firestore-debug.log; do
            if [ -f "$log" ]; then cp "$log" ci-logs/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
            ci-logs/
          retention-days: 14
